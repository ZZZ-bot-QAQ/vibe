:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;

}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

.form-check-label {

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {

  height: 20px;

          &lt;div class=&quot;rd-grid&quot;&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;优先排查的异常区域&lt;/h2&gt;&lt;button class=&quot;rd-link&quot; data-go=&quot;anomalies&quot;&gt;查看全部&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;腐化牢房&lt;/strong&gt;&lt;span class=&quot;rd-badge&quot;&gt;异常&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:82%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;48.1%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;钟楼&lt;/strong&gt;&lt;span class=&quot;rd-badge&quot;&gt;异常&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:69%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;41.5%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;被遗忘的陵墓&lt;/strong&gt;&lt;span class=&quot;rd-badge&quot;&gt;偏高&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:54%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;36.9%&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;rd-note&quot;&gt;数值为区域死亡率。红色区域显著高于同难度、相近路线和构筑条件下的预期水平。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;本模式的合理基准&lt;/h2&gt;&lt;/div&gt;&lt;p class=&quot;rd-note&quot; id=&quot;mode-target&quot;&gt;&lt;strong&gt;困难模式：&lt;/strong&gt;区域死亡率 32%–42%；Boss 击败率 38%–55%；平均单场战斗 85–120 秒。&lt;/p&gt;&lt;p class=&quot;rd-note&quot;&gt;腐化牢房的死亡集中在进入后 90 秒内；近战构筑的死亡率比远程构筑高 18.7 个百分点。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;rd-primary&quot; data-go=&quot;diagnosis&quot;&gt;选择关卡并诊断&lt;/button&gt;&lt;/section&gt;&lt;/div&gt;

        &lt;section class=&quot;rd-panel&quot; data-panel=&quot;data&quot;&gt;&lt;h1&gt;数据接入&lt;/h1&gt;&lt;p class=&quot;rd-sub&quot;&gt;导入设计数值和真实 Run 记录，系统会先校验字段，再生成可模拟的难度模型。&lt;/p&gt;&lt;div class=&quot;rd-grid&quot;&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;已连接的数据集&lt;/h2&gt;&lt;span class=&quot;rd-label&quot;&gt;最近同步 12 分钟前&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;关卡与路线配置&lt;/strong&gt;&lt;span class=&quot;rd-badge&quot;&gt;已就绪&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:100%;background:light-dark(#2e9b62,#5fd28d)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;126 条&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;敌人与 Boss 数值&lt;/strong&gt;&lt;span class=&quot;rd-badge&quot;&gt;已就绪&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:100%;background:light-dark(#2e9b62,#5fd28d)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;318 条&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;武器、技能与变异&lt;/strong&gt;&lt;span class=&quot;rd-badge&quot;&gt;已就绪&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:94%;background:light-dark(#2e9b62,#5fd28d)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;94%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;玩家 Run 事件日志&lt;/strong&gt;&lt;span class=&quot;rd-badge&quot;&gt;已就绪&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:100%;background:light-dark(#2e9b62,#5fd28d)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;28,416&lt;/span&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;rd-primary&quot;&gt;导入 CSV / JSON 数据&lt;/button&gt;&lt;/section&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;最低输入要求&lt;/h2&gt;&lt;/div&gt;&lt;p class=&quot;rd-note&quot;&gt;&lt;strong&gt;设计数据：&lt;/strong&gt;敌人属性、敌人组合规则、地图路线、掉落和补给规则、武器/技能效果。&lt;/p&gt;&lt;p class=&quot;rd-note&quot;&gt;&lt;strong&gt;Run 数据：&lt;/strong&gt;玩家构筑快照、战斗开始与结束、伤害/治疗、死亡、通关和退出事件。&lt;/p&gt;&lt;p class=&quot;rd-note&quot;&gt;&lt;strong&gt;没有真实玩家数据？&lt;/strong&gt;也可以仅导入设计数值，先用模拟 Run 发现高风险区域；上线后再由真实数据校准。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;/section&gt;
        &lt;section class=&quot;rd-panel&quot; data-panel=&quot;targets&quot;&gt;&lt;h1&gt;目标难度曲线&lt;/h1&gt;&lt;p class=&quot;rd-sub&quot;&gt;为每种模式设定“合理而有挑战”的目标区间；异常检测按关卡在整条曲线中的位置判断，而非只看单一死亡率。&lt;/p&gt;&lt;div class=&quot;rd-grid&quot;&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;困难模式 · 区域死亡率目标&lt;/h2&gt;&lt;span class=&quot;rd-label&quot;&gt;可由策划编辑&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;前期：被囚者牢房&lt;/strong&gt;&lt;span class=&quot;rd-label&quot;&gt;目标&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:30%;background:light-dark(#4995df,#73b9ff)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;22%–28%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;中期：壁垒 / 下水道&lt;/strong&gt;&lt;span class=&quot;rd-label&quot;&gt;目标&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:45%;background:light-dark(#4995df,#73b9ff)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;28%–36%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;后期：钟楼 / 陵墓&lt;/strong&gt;&lt;span class=&quot;rd-label&quot;&gt;目标&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:62%;background:light-dark(#4995df,#73b9ff)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;32%–42%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;Boss：山巅城堡&lt;/strong&gt;&lt;span class=&quot;rd-label&quot;&gt;目标&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:72%;background:light-dark(#4995df,#73b9ff)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;38%–55%&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;四种模式的合理基准&lt;/h2&gt;&lt;/div&gt;&lt;table class=&quot;rd-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;模式&lt;/th&gt;&lt;th&gt;区域死亡率&lt;/th&gt;&lt;th&gt;Boss 击败率&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;简单&lt;/td&gt;&lt;td&gt;12%–22%&lt;/td&gt;&lt;td&gt;70%–82%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;普通&lt;/td&gt;&lt;td&gt;22%–32%&lt;/td&gt;&lt;td&gt;55%–70%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;困难&lt;/td&gt;&lt;td&gt;32%–42%&lt;/td&gt;&lt;td&gt;38%–55%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;地狱&lt;/td&gt;&lt;td&gt;42%–58%&lt;/td&gt;&lt;td&gt;20%–38%&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;button type=&quot;button&quot; class=&quot;rd-primary&quot;&gt;编辑目标曲线&lt;/button&gt;&lt;/section&gt;&lt;/div&gt;&lt;/section&gt;
        &lt;section class=&quot;rd-panel&quot; data-panel=&quot;anomalies&quot;&gt;&lt;h1&gt;区域难度排序&lt;/h1&gt;&lt;p class=&quot;rd-sub&quot;&gt;展示当前版本全部 12 个区域；同时发现过难、过易与波动过大的关卡，并按修复优先级排序。&lt;/p&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;全部区域&lt;/h2&gt;&lt;span class=&quot;rd-label&quot;&gt;严重度 × 受影响人数 × 流程重要性&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-table-wrap&quot;&gt;&lt;table class=&quot;rd-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;区域 / 关卡&lt;/th&gt;&lt;th&gt;异常类型&lt;/th&gt;&lt;th&gt;优先级&lt;/th&gt;&lt;th&gt;状态 / 置信度&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;01&lt;/td&gt;&lt;td&gt;&lt;strong&gt;腐化牢房&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;过难 · 48.1%&lt;/td&gt;&lt;td class=&quot;rd-badge&quot;&gt;96 / 100&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-critical&quot;&gt;严重 · 高&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;02&lt;/td&gt;&lt;td&gt;&lt;strong&gt;钟楼&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;过难 · 41.5%&lt;/td&gt;&lt;td class=&quot;rd-badge&quot;&gt;88 / 100&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-critical&quot;&gt;严重 · 高&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;03&lt;/td&gt;&lt;td&gt;&lt;strong&gt;被遗忘的陵墓&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;过难 · 36.9%&lt;/td&gt;&lt;td class=&quot;rd-badge&quot;&gt;72 / 100&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-high&quot;&gt;高风险 · 中&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;04&lt;/td&gt;&lt;td&gt;&lt;strong&gt;沉睡的庇护所&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;波动过大&lt;/td&gt;&lt;td class=&quot;rd-badge&quot;&gt;65 / 100&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-high&quot;&gt;高风险 · 高&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;05&lt;/td&gt;&lt;td&gt;&lt;strong&gt;猛毒下水道&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;轻度偏高&lt;/td&gt;&lt;td&gt;51 / 100&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-medium&quot;&gt;观察 · 高&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;06&lt;/td&gt;&lt;td&gt;&lt;strong&gt;壁垒&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;正常&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-normal&quot;&gt;正常 · 高&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;07&lt;/td&gt;&lt;td&gt;&lt;strong&gt;旧下水道&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;正常&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-normal&quot;&gt;正常 · 高&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;08&lt;/td&gt;&lt;td&gt;&lt;strong&gt;被囚者牢房&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;正常&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-normal&quot;&gt;正常 · 高&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;09&lt;/td&gt;&lt;td&gt;&lt;strong&gt;作呕地窖&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;偏易 · 26.8%&lt;/td&gt;&lt;td&gt;39 / 100&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-medium&quot;&gt;需观察 · 中&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;&lt;strong&gt;雾萦港湾&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;正常&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-normal&quot;&gt;正常 · 高&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11&lt;/td&gt;&lt;td&gt;&lt;strong&gt;荒废植物园&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;偏易 · 23.1%&lt;/td&gt;&lt;td&gt;31 / 100&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-medium&quot;&gt;需观察 · 中&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;12&lt;/td&gt;&lt;td&gt;&lt;strong&gt;山巅城堡&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;正常&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-normal&quot;&gt;正常 · 高&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;rd-note&quot;&gt;&lt;strong&gt;可信度：&lt;/strong&gt;高表示样本充分且字段完整；中表示建议结合测试与补充数据判断。这样系统既不遗漏“太简单”的问题，也不会因少量样本过度报警。&lt;/p&gt;&lt;/section&gt;&lt;/section&gt;
        &lt;section class=&quot;rd-panel&quot; data-panel=&quot;builds&quot;&gt;&lt;h1&gt;构筑公平性&lt;/h1&gt;&lt;p class=&quot;rd-sub&quot;&gt;比较不同武器、流派、变异在相同区域和玩家分层下的表现，发现某一种 Build 被不合理压制或过强的情况。&lt;/p&gt;&lt;div class=&quot;rd-grid&quot;&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;腐化牢房 · 困难模式&lt;/h2&gt;&lt;span class=&quot;rd-label&quot;&gt;死亡率目标 32%–42%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;近战流派&lt;/strong&gt;&lt;span class=&quot;rd-status rd-critical&quot;&gt;偏难&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:83%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;54.2%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;远程流派&lt;/strong&gt;&lt;span class=&quot;rd-status rd-normal&quot;&gt;正常&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:55%;background:light-dark(#2e9b62,#5fd28d)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;35.7%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;盾反流派&lt;/strong&gt;&lt;span class=&quot;rd-status rd-high&quot;&gt;偏难&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:70%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;45.1%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-row&quot;&gt;&lt;strong&gt;状态异常流派&lt;/strong&gt;&lt;span class=&quot;rd-status rd-medium&quot;&gt;偏易&lt;/span&gt;&lt;div class=&quot;rd-track&quot;&gt;&lt;div class=&quot;rd-fill&quot; style=&quot;width:38%;background:light-dark(#d3a83c,#e8cf67)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;rd-num&quot;&gt;24.8%&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;公平性结论&lt;/h2&gt;&lt;/div&gt;&lt;p class=&quot;rd-note&quot;&gt;&lt;strong&gt;问题：&lt;/strong&gt;近战与远程构筑死亡率相差 18.5 个百分点，超过公平性阈值 12 个百分点。&lt;/p&gt;&lt;p class=&quot;rd-note&quot;&gt;&lt;strong&gt;建议：&lt;/strong&gt;优先优化精英远程压制的躲避窗口，而不是整体削弱所有敌人；这样能修复近战问题，避免远程 Build 进一步过易。&lt;/p&gt;&lt;button class=&quot;rd-primary&quot; type=&quot;button&quot; data-go=&quot;diagnosis&quot;&gt;诊断近战构筑&lt;/button&gt;&lt;/section&gt;&lt;/div&gt;&lt;/section&gt;
        &lt;section class=&quot;rd-panel&quot; data-panel=&quot;diagnosis&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;div&gt;&lt;h1&gt;原因诊断&lt;/h1&gt;&lt;p class=&quot;rd-sub&quot;&gt;选择任意关卡和玩家分层，系统以当前难度模式的合理数值区间为基准进行诊断。&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;select id=&quot;level-select&quot; class=&quot;rd-select&quot; aria-label=&quot;选择要诊断的关卡&quot;&gt;&lt;option&gt;腐化牢房&lt;/option&gt;&lt;option&gt;钟楼&lt;/option&gt;&lt;option&gt;被遗忘的陵墓&lt;/option&gt;&lt;option&gt;沉睡的庇护所&lt;/option&gt;&lt;option&gt;猛毒下水道&lt;/option&gt;&lt;option&gt;壁垒&lt;/option&gt;&lt;option&gt;旧下水道&lt;/option&gt;&lt;option&gt;被囚者牢房&lt;/option&gt;&lt;option&gt;作呕地窖&lt;/option&gt;&lt;option&gt;雾萦港湾&lt;/option&gt;&lt;option&gt;荒废植物园&lt;/option&gt;&lt;option&gt;山巅城堡&lt;/option&gt;&lt;/select&gt;&lt;select class=&quot;rd-select&quot; aria-label=&quot;选择玩家分层&quot;&gt;&lt;option&gt;全部玩家&lt;/option&gt;&lt;option&gt;新手玩家&lt;/option&gt;&lt;option&gt;熟练玩家&lt;/option&gt;&lt;option&gt;高阶玩家&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;rd-sub&quot;&gt;近战构筑 · 审判者 + 失败实验体 · 1,284 次有效战斗 · &lt;span class=&quot;rd-status rd-normal&quot;&gt;数据置信度：高&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;rd-grid&quot;&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;关键影响因素&lt;/h2&gt;&lt;span class=&quot;rd-badge&quot;&gt;死亡率 54.2%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-cause&quot;&gt;&lt;span class=&quot;rd-rank&quot;&gt;01&lt;/span&gt;&lt;span&gt;精英怪远程伤害过高&lt;/span&gt;&lt;strong&gt;38%&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;rd-cause&quot;&gt;&lt;span class=&quot;rd-rank&quot;&gt;02&lt;/span&gt;&lt;span&gt;进入区域时平均血量不足&lt;/span&gt;&lt;strong&gt;25%&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;rd-cause&quot;&gt;&lt;span class=&quot;rd-rank&quot;&gt;03&lt;/span&gt;&lt;span&gt;近战构筑缺少安全输出窗口&lt;/span&gt;&lt;strong&gt;21%&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;rd-cause&quot;&gt;&lt;span class=&quot;rd-rank&quot;&gt;04&lt;/span&gt;&lt;span&gt;控制技能连续覆盖&lt;/span&gt;&lt;strong&gt;16%&lt;/strong&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;可行动建议&lt;/h2&gt;&lt;/div&gt;&lt;p class=&quot;rd-note&quot; id=&quot;diagnosis-target&quot;&gt;&lt;strong&gt;当前合理基准：&lt;/strong&gt;困难模式下，区域死亡率应处于 32%–42%，Boss 击败率应处于 38%–55%。&lt;/p&gt;&lt;p class=&quot;rd-note&quot;&gt;&lt;strong&gt;优先建议：&lt;/strong&gt;将审判者的远程攻击伤害下调 12%，预期可使该场景死亡率降低至 39%–43%。&lt;/p&gt;&lt;button class=&quot;rd-primary&quot; type=&quot;button&quot; data-go=&quot;simulation&quot;&gt;去模拟调整效果&lt;/button&gt;&lt;/section&gt;&lt;/div&gt;&lt;/section&gt;
        &lt;section class=&quot;rd-panel&quot; data-panel=&quot;simulation&quot;&gt;&lt;h1&gt;自动模拟与参数调整&lt;/h1&gt;&lt;p class=&quot;rd-sub&quot;&gt;以导入的数值规则、玩家构筑和路线分布批量生成模拟 Run；只需调整一个因素，也可组合评估整体影响。&lt;/p&gt;&lt;div class=&quot;rd-sim&quot;&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;模拟参数&lt;/h2&gt;&lt;span class=&quot;rd-label&quot;&gt;模拟样本 10,000 局&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;rd-label&quot;&gt;Boss 与敌人&lt;/p&gt;&lt;div class=&quot;rd-control&quot;&gt;&lt;label for=&quot;boss-hp&quot;&gt;Boss 生命值&lt;/label&gt;&lt;span class=&quot;rd-value&quot; id=&quot;boss-hp-value&quot;&gt;100%&lt;/span&gt;&lt;input id=&quot;boss-hp&quot; type=&quot;range&quot; min=&quot;60&quot; max=&quot;150&quot; value=&quot;100&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-control&quot;&gt;&lt;label for=&quot;boss-dmg&quot;&gt;Boss / 敌人伤害&lt;/label&gt;&lt;span class=&quot;rd-value&quot; id=&quot;boss-dmg-value&quot;&gt;100%&lt;/span&gt;&lt;input id=&quot;boss-dmg&quot; type=&quot;range&quot; min=&quot;60&quot; max=&quot;150&quot; value=&quot;100&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-control&quot;&gt;&lt;label for=&quot;enemy-count&quot;&gt;敌人数量与刷新强度&lt;/label&gt;&lt;span class=&quot;rd-value&quot; id=&quot;enemy-count-value&quot;&gt;100%&lt;/span&gt;&lt;input id=&quot;enemy-count&quot; type=&quot;range&quot; min=&quot;50&quot; max=&quot;140&quot; value=&quot;100&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-control&quot;&gt;&lt;label for=&quot;pairing&quot;&gt;精英 / 敌人组合概率&lt;/label&gt;&lt;span class=&quot;rd-value&quot; id=&quot;pairing-value&quot;&gt;100%&lt;/span&gt;&lt;input id=&quot;pairing&quot; type=&quot;range&quot; min=&quot;50&quot; max=&quot;140&quot; value=&quot;100&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;rd-label&quot;&gt;玩家成长与构筑&lt;/p&gt;&lt;div class=&quot;rd-control&quot;&gt;&lt;label for=&quot;player-hp&quot;&gt;玩家基础生命与防御&lt;/label&gt;&lt;span class=&quot;rd-value&quot; id=&quot;player-hp-value&quot;&gt;100%&lt;/span&gt;&lt;input id=&quot;player-hp&quot; type=&quot;range&quot; min=&quot;60&quot; max=&quot;150&quot; value=&quot;100&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-control&quot;&gt;&lt;label for=&quot;player-dmg&quot;&gt;玩家基础伤害&lt;/label&gt;&lt;span class=&quot;rd-value&quot; id=&quot;player-dmg-value&quot;&gt;100%&lt;/span&gt;&lt;input id=&quot;player-dmg&quot; type=&quot;range&quot; min=&quot;60&quot; max=&quot;150&quot; value=&quot;100&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-control&quot;&gt;&lt;label for=&quot;gear&quot;&gt;装备品质与词条强度&lt;/label&gt;&lt;span class=&quot;rd-value&quot; id=&quot;gear-value&quot;&gt;100%&lt;/span&gt;&lt;input id=&quot;gear&quot; type=&quot;range&quot; min=&quot;60&quot; max=&quot;150&quot; value=&quot;100&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-control&quot;&gt;&lt;label for=&quot;skill&quot;&gt;技能 / 变异协同强度&lt;/label&gt;&lt;span class=&quot;rd-value&quot; id=&quot;skill-value&quot;&gt;100%&lt;/span&gt;&lt;input id=&quot;skill&quot; type=&quot;range&quot; min=&quot;60&quot; max=&quot;150&quot; value=&quot;100&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;rd-label&quot;&gt;区域与资源&lt;/p&gt;&lt;div class=&quot;rd-control&quot;&gt;&lt;label for=&quot;healing&quot;&gt;补给与治疗出现概率&lt;/label&gt;&lt;span class=&quot;rd-value&quot; id=&quot;healing-value&quot;&gt;100%&lt;/span&gt;&lt;input id=&quot;healing&quot; type=&quot;range&quot; min=&quot;50&quot; max=&quot;170&quot; value=&quot;100&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-control&quot;&gt;&lt;label for=&quot;drop&quot;&gt;卷轴 / 掉落资源投放&lt;/label&gt;&lt;span class=&quot;rd-value&quot; id=&quot;drop-value&quot;&gt;100%&lt;/span&gt;&lt;input id=&quot;drop&quot; type=&quot;range&quot; min=&quot;50&quot; max=&quot;170&quot; value=&quot;100&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-control&quot;&gt;&lt;label for=&quot;route&quot;&gt;路线长度与战斗密度&lt;/label&gt;&lt;span class=&quot;rd-value&quot; id=&quot;route-value&quot;&gt;100%&lt;/span&gt;&lt;input id=&quot;route&quot; type=&quot;range&quot; min=&quot;60&quot; max=&quot;150&quot; value=&quot;100&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;模拟结果&lt;/h2&gt;&lt;span class=&quot;rd-label&quot;&gt;当前 → 模拟后&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rd-result&quot;&gt;&lt;span&gt;区域死亡率&lt;br&gt;&lt;small class=&quot;rd-label&quot;&gt;54.2%&lt;/small&gt;&lt;/span&gt;&lt;strong id=&quot;death-result&quot;&gt;54.2%&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;rd-result&quot;&gt;&lt;span&gt;Boss 击败率&lt;br&gt;&lt;small class=&quot;rd-label&quot;&gt;44.9%&lt;/small&gt;&lt;/span&gt;&lt;strong id=&quot;boss-result&quot;&gt;44.9%&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;rd-result&quot;&gt;&lt;span&gt;平均战斗时长&lt;br&gt;&lt;small class=&quot;rd-label&quot;&gt;118 秒&lt;/small&gt;&lt;/span&gt;&lt;strong id=&quot;time-result&quot;&gt;118 秒&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;rd-result&quot;&gt;&lt;span&gt;难度异常指数&lt;br&gt;&lt;small class=&quot;rd-label&quot;&gt;+2.6σ&lt;/small&gt;&lt;/span&gt;&lt;strong id=&quot;sigma-result&quot;&gt;+2.6σ&lt;/strong&gt;&lt;/div&gt;&lt;p class=&quot;rd-note&quot;&gt;&lt;strong&gt;覆盖因素：&lt;/strong&gt;敌人属性、攻击节奏、组合规则、玩家成长、装备/技能协同、路线、资源与补给，也可接入 AI 行为、机关、状态异常、商店经济和难度层级等专属规则。&lt;/p&gt;&lt;button class=&quot;rd-primary&quot; type=&quot;button&quot; data-go=&quot;plans&quot;&gt;保存为调整方案&lt;/button&gt;&lt;/section&gt;&lt;/div&gt;&lt;/section&gt;
        &lt;section class=&quot;rd-panel&quot; data-panel=&quot;compare&quot;&gt;&lt;h1&gt;版本对比与回归检测&lt;/h1&gt;&lt;p class=&quot;rd-sub&quot;&gt;将候选数值版本与基准版本逐项对比，确认修复是否有效，并自动提示新引入的难度回归。&lt;/p&gt;&lt;div class=&quot;rd-grid&quot;&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;v1.7.4 → v1.8.0&lt;/h2&gt;&lt;span class=&quot;rd-status rd-high&quot;&gt;发现 2 项回归&lt;/span&gt;&lt;/div&gt;&lt;table class=&quot;rd-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;变化&lt;/th&gt;&lt;th&gt;判断&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;腐化牢房 · 近战&lt;/td&gt;&lt;td&gt;死亡率 +15.4%&lt;/td&gt;&lt;td class=&quot;rd-badge&quot;&gt;新异常&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;钟楼 · 双精英&lt;/td&gt;&lt;td&gt;死亡率 +10.1%&lt;/td&gt;&lt;td class=&quot;rd-badge&quot;&gt;新异常&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;荒废植物园&lt;/td&gt;&lt;td&gt;死亡率 -8.2%&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-medium&quot;&gt;偏易&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;壁垒&lt;/td&gt;&lt;td&gt;死亡率 +0.6%&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-normal&quot;&gt;稳定&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/section&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;发布前结论&lt;/h2&gt;&lt;/div&gt;&lt;p class=&quot;rd-note&quot;&gt;&lt;strong&gt;已修复：&lt;/strong&gt;旧版“猛毒下水道远程流派过难”不再触发异常。&lt;/p&gt;&lt;p class=&quot;rd-note&quot;&gt;&lt;strong&gt;新增风险：&lt;/strong&gt;精英攻击频率的改动在腐化牢房和钟楼造成回归，建议阻断合入或附带修复方案。&lt;/p&gt;&lt;button class=&quot;rd-primary&quot; type=&quot;button&quot; data-go=&quot;plans&quot;&gt;查看方案验证&lt;/button&gt;&lt;/section&gt;&lt;/div&gt;&lt;/section&gt;
        &lt;section class=&quot;rd-panel&quot; data-panel=&quot;plans&quot;&gt;&lt;h1&gt;调整方案与上线验证&lt;/h1&gt;&lt;p class=&quot;rd-sub&quot;&gt;记录数值决策、审批过程、模拟预期与上线后的真实效果，形成可追溯的平衡性闭环。&lt;/p&gt;&lt;section class=&quot;rd-section&quot;&gt;&lt;div class=&quot;rd-section-head&quot;&gt;&lt;h2&gt;方案列表&lt;/h2&gt;&lt;button class=&quot;rd-link&quot; data-go=&quot;simulation&quot;&gt;新建方案&lt;/button&gt;&lt;/div&gt;&lt;table class=&quot;rd-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;方案&lt;/th&gt;&lt;th&gt;调整内容&lt;/th&gt;&lt;th&gt;状态&lt;/th&gt;&lt;th&gt;验证结果&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;RB-018&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;rd-label&quot;&gt;腐化牢房近战修复&lt;/span&gt;&lt;/td&gt;&lt;td&gt;审判者伤害 -12%&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-high&quot;&gt;待审批&lt;/span&gt;&lt;/td&gt;&lt;td&gt;预测死亡率 54.2% → 40.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;RB-017&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;rd-label&quot;&gt;猛毒下水道远程修复&lt;/span&gt;&lt;/td&gt;&lt;td&gt;远程精英刷新 -8%&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-normal&quot;&gt;已上线&lt;/span&gt;&lt;/td&gt;&lt;td&gt;真实值 43.1% → 34.6%&lt;br&gt;&lt;span class=&quot;rd-label&quot;&gt;预测误差 1.2%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;RB-016&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;rd-label&quot;&gt;植物园资源投放&lt;/span&gt;&lt;/td&gt;&lt;td&gt;卷轴掉落 +10%&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rd-status rd-medium&quot;&gt;需复核&lt;/span&gt;&lt;/td&gt;&lt;td&gt;整体正常，状态异常流派偏易&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;rd-note&quot;&gt;每个方案都可保存调整者、备注、预期范围、目标版本和审批记录；上线后系统自动使用真实 Run 校准模拟模型。&lt;/p&gt;&lt;/section&gt;&lt;/section&gt;
      &lt;/main&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;rogue-difficulty-app&#x27;);
      const show = id =&gt; { root.querySelectorAll(&#x27;[data-panel]&#x27;).forEach(p =&gt; p.classList.toggle(&#x27;is-active&#x27;, p.dataset.panel === id)); root.querySelectorAll(&#x27;[data-tab]&#x27;).forEach(b =&gt; b.setAttribute(&#x27;aria-selected&#x27;, b.dataset.tab === id)); };
      root.querySelectorAll(&#x27;[data-tab]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; show(button.dataset.tab)));
      root.querySelectorAll(&#x27;[data-go]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; show(button.dataset.go)));
      const ids = [&#x27;boss-hp&#x27;,&#x27;boss-dmg&#x27;,&#x27;enemy-count&#x27;,&#x27;pairing&#x27;,&#x27;player-hp&#x27;,&#x27;player-dmg&#x27;,&#x27;gear&#x27;,&#x27;skill&#x27;,&#x27;healing&#x27;,&#x27;drop&#x27;,&#x27;route&#x27;];
      const inputs = ids.map(id =&gt; root.querySelector(&#x27;#&#x27; + id));
      const update = () =&gt; { const values = Object.fromEntries(inputs.map(x =&gt; [x.id, Number(x.value)])); inputs.forEach(x =&gt; root.querySelector(&#x27;#&#x27; + x.id + &#x27;-value&#x27;).textContent = x.value + &#x27;%&#x27;); const threat = (values[&#x27;boss-hp&#x27;]-100)*.14 + (values[&#x27;boss-dmg&#x27;]-100)*.38 + (values[&#x27;enemy-count&#x27;]-100)*.22 + (values.pairing-100)*.18 + (values.route-100)*.12; const support = (values[&#x27;player-hp&#x27;]-100)*.18 + (values[&#x27;player-dmg&#x27;]-100)*.27 + (values.gear-100)*.19 + (values.skill-100)*.16 + (values.healing-100)*.15 + (values.drop-100)*.12; const delta = support - threat; const death = Math.max(14, Math.min(82, 54.2 - delta*.34)); const boss = Math.max(12, Math.min(91, 44.9 + delta*.31)); root.querySelector(&#x27;#death-result&#x27;).textContent = death.toFixed(1) + &#x27;%&#x27;; root.querySelector(&#x27;#boss-result&#x27;).textContent = boss.toFixed(1) + &#x27;%&#x27;; root.querySelector(&#x27;#time-result&#x27;).textContent = Math.max(48, Math.round(118 + threat*.38 - support*.30)) + &#x27; 秒&#x27;; root.querySelector(&#x27;#sigma-result&#x27;).textContent = &#x27;+&#x27; + Math.max(.2, 2.6 - delta*.037).toFixed(1) + &#x27;σ&#x27;; };
      inputs.forEach(input =&gt; input.addEventListener(&#x27;input&#x27;, update));
      const modes = { easy: [&#x27;简单模式&#x27;, &#x27;12%–22%&#x27;, &#x27;70%–82%&#x27;, &#x27;55–85&#x27;], normal: [&#x27;普通模式&#x27;, &#x27;22%–32%&#x27;, &#x27;55%–70%&#x27;, &#x27;70–100&#x27;], hard: [&#x27;困难模式&#x27;, &#x27;32%–42%&#x27;, &#x27;38%–55%&#x27;, &#x27;85–120&#x27;], hell: [&#x27;地狱难度&#x27;, &#x27;42%–58%&#x27;, &#x27;20%–38%&#x27;, &#x27;105–155&#x27;] };
      const modeSelect = root.querySelector(&#x27;#mode-select&#x27;);
      const setMode = () =&gt; { const [name, death, boss, duration] = modes[modeSelect.value]; root.querySelector(&#x27;#mode-summary&#x27;).textContent = name + &#x27;的合理区域死亡率：&#x27; + death; root.querySelector(&#x27;#mode-target&#x27;).innerHTML = &#x27;&lt;strong&gt;&#x27; + name + &#x27;：&lt;/strong&gt;区域死亡率 &#x27; + death + &#x27;；Boss 击败率 &#x27; + boss + &#x27;；平均单场战斗 &#x27; + duration + &#x27; 秒。&#x27;; root.querySelector(&#x27;#diagnosis-target&#x27;).innerHTML = &#x27;&lt;strong&gt;当前合理基准：&lt;/strong&gt;&#x27; + name + &#x27;下，区域死亡率应处于 &#x27; + death + &#x27;，Boss 击败率应处于 &#x27; + boss + &#x27;。&#x27;; };
      modeSelect.addEventListener(&#x27;change&#x27;, setMode);
    })();
  &lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }

    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),

    }

  };

    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }

    activeTrigger = null;
    tooltip?.remove();

    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;

      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {

        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||

    }

    pendingTrigger = trigger;
    const delay =

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
